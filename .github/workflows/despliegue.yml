name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:
  # La llama ingesta-horaria.yml tras publicar en `datos`: su push, hecho con
  # GITHUB_TOKEN, no dispara este flujo por sí solo.
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    name: Construir
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # El nombre sale de GITHUB_REPOSITORY: llamado desde la ingesta, el evento
      # es schedule y github.event.repository no está garantizado.
      - run: RADAR_BASE="/${GITHUB_REPOSITORY#*/}/" npm run build
      - name: Añadir los datos publicados (rama datos), si existen
        run: |
          if git ls-remote --exit-code --heads origin datos > /dev/null; then
            git fetch --depth=1 origin datos
            mkdir -p apps/web/dist/datos
            git archive FETCH_HEAD | tar -x -C apps/web/dist/datos
          else
            echo "La rama datos aún no existe; se despliega sin datos."
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  desplegar:
    name: Desplegar
    needs: construir
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
